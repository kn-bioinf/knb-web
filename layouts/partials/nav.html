{{ $home := "/" | absURL }}
{{ $isProjekty := eq .Section "projekty" }}
{{ $isAktualnosci := eq .Section "aktualnosci" }}

<!-- Hamburger toggle button for mobile -->
<button id="nav-toggle">☰</button>

<!-- Nav - pasek na górze -->
<nav id="nav">
	<ul>
		<li><a href="{{ $home }}#intro"{{ if .IsHome }} class="active"{{ end }}>O nas</a></li>
		<li><a href="{{ $home }}#aktualnosci"{{ if $isAktualnosci }} class="active"{{ end }}>Aktualności</a></li>
		<li><a href="{{ $home }}#zarzad">Zarząd</a></li>
		<li><a href="{{ "projekty/" | absURL }}"{{ if $isProjekty }} class="active"{{ end }}>Projekty</a></li>
		<li><a href="{{ $home }}#dolacz">Dołącz</a></li>
		<li><a href="{{ $home }}#kontakt">Kontakt</a></li>
	</ul>
</nav>
