<!-- Pojedynczy projekt (z opcjonalną osadzoną grą) -->

<html>
	<head>
		<title>KNB UW — {{ .Title }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{{ "css/main.css" | absURL }}" />
		<noscript><link rel="stylesheet" href="{{ "css/noscript.css" | absURL }}" /></noscript>
		<link rel="icon" href="{{ "favicon.ico" | absURL }}" type="image/x-icon">
		<style>
			/* Responsywne okno gry — utrzymuje proporcje, skaluje się na telefonie */
			.game-embed {
				position: relative;
				width: 100%;
				max-width: 1280px;
				margin: 0 auto 1.5rem auto;
				padding-bottom: {{ .Params.embed_ratio | default "56.25" }}%;
				height: 0;
				overflow: hidden;
				background: #0f1937;
				border-radius: 8px;
			}
			.game-embed iframe {
				position: absolute;
				top: 0; left: 0;
				width: 100%; height: 100%;
				border: 0;
				outline: none;
			}
			.game-actions {
				text-align: center;
				margin-bottom: 2rem;
			}
			.game-actions .button { margin: 0 .35rem .5rem .35rem; }

			/* Przycisk pełnego ekranu pokazujemy TYLKO na dotyku (telefon/tablet);
			   na desktopie go nie ma - tam zostaje normalny pasek adresu. */
			#fs-btn { display: none; }
			@media (pointer: coarse) { #fs-btn { display: inline-block; } }

			/* Pełny ekran (jak YouTube): kontener wypełnia ekran, a gra zostaje
			   wyśrodkowana w proporcji 16:9 na czarnym tle — bez zniekształceń.
			   Klasę .fs przełącza JS na zdarzeniu fullscreenchange (unikamy
			   pułapki z pseudo-klasami :fullscreen/:-webkit-full-screen, które
			   w liście selektorów potrafią unieważnić całą regułę). */
			.game-embed.fs {
				width: 100vw; height: 100vh;
				max-width: none;
				margin: 0;
				padding: 0;
				border-radius: 0;
				background: #000;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.game-embed.fs iframe {
				position: static;
				width: min(100vw, 177.78vh);   /* największy prostokąt 16:9 */
				height: min(56.25vw, 100vh);
			}
		</style>
	</head>

	<body class="is-preload">

		<!-- Wrapper -->
		<div id="wrapper">

			{{ partial "header.html" . }}
			{{ partial "nav.html" . }}

			<!-- Main -->
			<div id="main">

				<section id="content" class="main">

					{{ if .Params.embed }}
						<div class="game-embed" id="game-embed">
							<iframe src="{{ .Params.embed | absURL }}"
							        title="{{ .Title }}"
							        allow="autoplay; fullscreen; gamepad"
							        allowfullscreen></iframe>
						</div>
						<div class="game-actions">
							<a href="{{ .Params.embed | absURL }}" target="_blank" rel="noopener" class="button primary" id="fs-btn">Pełny ekran</a>
							{{ if .Params.github }}
								<a href="{{ .Params.github }}" target="_blank" rel="noopener" class="button">Kod na GitHub</a>
							{{ end }}
						</div>
						<script>
						(function () {
							var btn = document.getElementById("fs-btn");
							var box = document.getElementById("game-embed");
							if (!btn || !box) return;
							var req = box.requestFullscreen || box.webkitRequestFullscreen || box.msRequestFullscreen;

							// .fs = klasa stylu pełnego ekranu (16:9, czarne tło).
							function sync() {
								var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
								box.classList.toggle("fs", fsEl === box);
							}
							document.addEventListener("fullscreenchange", sync);
							document.addEventListener("webkitfullscreenchange", sync);

							btn.addEventListener("click", function (e) {
								// Przycisk widoczny tylko na dotyku (CSS @media pointer:coarse).
								// Wchodzimy w pełny ekran i blokujemy orientację poziomą
								// (jak YouTube). iOS Safari nie wspiera FS dla elementów != wideo
								// -> wtedy link otworzy grę w nowej karcie (fallback).
								if (!req) return;
								e.preventDefault();
								var done = req.call(box);
								Promise.resolve(done).then(function () {
									if (screen.orientation && screen.orientation.lock) {
										screen.orientation.lock("landscape").catch(function () {});
									}
								}).catch(function () {});
							});
						})();
						</script>
					{{ end }}

					<div class="article_content_post_flex">
						<div class="article_text">
							{{ .Content }}
						</div>
					</div>

					<div class="back_button_container">
						<a href="{{ "projekty/" | absURL }}" class="button primary">Powrót do projektów</a>
					</div>
				</section>

			</div>

			{{ partial "footer.html" . }}

		</div>

		<!-- Scripts -->
		<script src="{{ "js/jquery.min.js" | absURL }}"></script>
		<script src="{{ "js/jquery.scrollex.min.js" | absURL }}"></script>
		<script src="{{ "js/jquery.scrolly.min.js" | absURL }}"></script>
		<script src="{{ "js/browser.min.js" | absURL }}"></script>
		<script src="{{ "js/breakpoints.min.js" | absURL }}"></script>
		<script src="{{ "js/util.js" | absURL }}"></script>
		<script src="{{ "js/main.js" | absURL }}"></script>
		<script>
			document.addEventListener("DOMContentLoaded", function () {
				document.getElementById("nav-toggle").addEventListener("click", function () {
					const nav = document.getElementById("nav");
					nav.classList.toggle("open");
				});
			});
		</script>

	</body>
</html>
